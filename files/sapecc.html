<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sapecc - Marketplace Produk Digital</title>
<meta name="description" content="Marketplace produk digital dengan rekber: pembayaran ditahan sampai pesanan diterima.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#ECEFF7; --ink:#151A30; --muted:#5B6180; --line:#DCE0EC;
  --brand:#2D3FE0; --brand-ink:#FFFFFF; --brand-soft:#E3E6FD;
  --accent:#F5B301; --accent-ink:#2A1F00;
  --ok:#0B8560; --ok-soft:#DCF3EA; --danger:#D6392F; --danger-soft:#FCE3E1;
  --star:#B87B00; --sent:#8A5A00;
  --paper:#FFFEFA; --printer:#1A1F3A;
  --thumb-s:78%; --thumb-l:91%; --mono-l:32%;
  --font-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --font-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1124; --surface:#151A33; --surface-2:#1E2447; --ink:#E9ECF8; --muted:#9CA3C4; --line:#2A3158;
    --brand:#7F8CFF; --brand-ink:#0D1124; --brand-soft:#252C62;
    --accent:#FFC83D; --accent-ink:#2A1F00;
    --ok:#3CCB95; --ok-soft:#113A2D; --danger:#FF6F66; --danger-soft:#3E1B19;
    --star:#FFC83D; --sent:#FFC83D;
    --printer:#2B3264;
    --thumb-s:42%; --thumb-l:24%; --mono-l:80%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1124; --surface:#151A33; --surface-2:#1E2447; --ink:#E9ECF8; --muted:#9CA3C4; --line:#2A3158;
  --brand:#7F8CFF; --brand-ink:#0D1124; --brand-soft:#252C62;
  --accent:#FFC83D; --accent-ink:#2A1F00;
  --ok:#3CCB95; --ok-soft:#113A2D; --danger:#FF6F66; --danger-soft:#3E1B19;
  --star:#FFC83D; --sent:#FFC83D;
  --printer:#2B3264;
  --thumb-s:42%; --thumb-l:24%; --mono-l:80%;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;min-height:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img,svg{max-width:100%}
[hidden]{display:none !important}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-.02em;line-height:1.15;margin:0;font-weight:750}
p{margin:0 0 .8em}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--font-mono);letter-spacing:.02em}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}

/* ---------- top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:inline-flex;align-items:center;gap:9px;font:800 21px/1 var(--font-display);letter-spacing:-.035em;flex:none}
.mainnav{display:flex;gap:2px;margin-left:10px}
.mainnav a{padding:8px 11px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--muted)}
.mainnav a:hover{color:var(--ink);background:var(--surface-2)}
.mainnav a[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.topsearch{flex:1;max-width:360px;margin-left:auto;position:relative}
.topsearch input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px 0 38px}
.topsearch input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.topsearch svg{position:absolute;left:11px;top:10px;color:var(--muted);pointer-events:none}
.top-actions{display:flex;align-items:center;gap:6px;margin-left:12px}
body[data-route="home"] .topsearch{display:none}
body[data-route="home"] .top-actions{margin-left:auto}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.lang button{border:0;background:none;padding:6px 9px;font-size:12.5px;font-weight:750;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.icon-btn{position:relative;width:40px;height:40px;display:grid;place-items:center;border:0;background:none;border-radius:10px;flex:none;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.cart-count{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1}
#userbox{position:relative;display:flex;gap:6px;align-items:center}
.userbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;height:40px}
.userbtn .av{width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.userbtn .bal{font-size:13px;font-weight:750}
.umenu{position:absolute;right:0;top:calc(100% + 8px);width:268px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 22px 44px -20px rgba(10,14,40,.4);padding:8px;z-index:60}
.um-head{padding:8px 10px 10px}
.um-head strong{display:block}
.um-bal{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:10px;margin-bottom:6px}
.umenu a,.um-item{display:flex;width:100%;padding:9px 10px;border-radius:8px;border:0;background:none;text-align:left;font-weight:600;font-size:14px}
.umenu a:hover,.um-item:hover{background:var(--surface-2)}

/* ---------- buttons, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:14.5px;white-space:nowrap;background:var(--surface-2);color:var(--ink);text-align:center}
.btn:hover{border-color:var(--line)}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{filter:brightness(1.08);border-color:transparent}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-outline{background:transparent;border-color:var(--line)}
.btn-outline:hover{border-color:var(--ink)}
.btn-ghost{background:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent}
.btn-lg{height:48px;padding:0 22px;font-size:15.5px}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.input{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;width:100%}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input[aria-invalid="true"]{border-color:var(--danger)}
label{font-weight:650;font-size:13.5px}
.form-grid{display:grid;gap:14px}
.form-grid label{display:block;margin-bottom:6px}
.form-grid label.opt{display:flex;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--danger);font-size:13px;font-weight:600;margin:0}
.demo-note{font-size:12.5px;color:var(--muted);margin:0}
.chip{display:inline-flex;align-items:center;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- hero + receipt */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr);gap:56px;align-items:center;padding-top:52px;padding-bottom:36px}
.hero-title{font-size:clamp(40px,5.8vw,66px);font-weight:800;letter-spacing:-.04em;line-height:1;max-width:12ch}
.hero-sub{font-size:17px;color:var(--muted);max-width:46ch;margin:18px 0 26px}
.bigsearch{display:flex;background:var(--surface);border:1.5px solid var(--ink);border-radius:14px;padding:6px;gap:6px;max-width:620px}
.bigsearch select{border:0;background:var(--surface-2);border-radius:9px;padding:0 10px;font-weight:650;font-size:14px;max-width:190px}
.bigsearch input{flex:1;min-width:0;border:0;background:none;font-size:16px;padding:0 8px;height:44px}
.bigsearch input:focus,.bigsearch select:focus{outline:none}
.bigsearch:focus-within{box-shadow:0 0 0 4px var(--brand-soft)}
.bigsearch .btn{height:44px}
.quick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.quick-label{font-size:13.5px;color:var(--muted);margin-right:2px}
.receipt-area{width:100%;max-width:370px;justify-self:center}
.printer{height:20px;background:var(--printer);border-radius:10px 10px 7px 7px;margin:0 -14px;position:relative;z-index:2}
.printer::after{content:"";position:absolute;left:16px;right:16px;bottom:4px;height:3px;border-radius:2px;background:rgba(0,0,0,.45)}
.receipt-wrap{filter:drop-shadow(0 16px 22px rgba(18,24,60,.2))}
.receipt{margin-top:-6px;background:var(--paper);color:#23242B;font-family:var(--font-mono);font-size:12px;line-height:1.45;text-transform:uppercase;letter-spacing:.02em;padding:20px 18px 32px;
  --zz:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;
  -webkit-mask:var(--zz);mask:var(--zz)}
.r-head{text-align:center;display:grid;gap:1px}
.r-head strong{font-size:15px;letter-spacing:.2em}
.r-sep{border-top:1.5px dashed #B9BAC4;margin:12px 0}
.r-lines{list-style:none;margin:0;padding:0;height:318px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-content:start}
.r-line{min-width:0}
.r-top,.r-mid,.r-row{display:flex;justify-content:space-between;gap:12px}
.r-top{color:#6B6D78}
.r-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.r-top>span,.r-mid>span:last-child{flex:none}
.r-st{font-size:11px;font-weight:700}
.r-st span{padding:0 4px;background:#23242B;color:#FFFEFA}
.r-st.done span{background:#0B7A55}
.r-row{font-weight:700}
.r-foot{text-align:center;margin-top:12px;color:#6B6D78;text-transform:none;font-size:11.5px}
.r-line.print{animation:print .55s steps(5) both}
@keyframes print{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}

/* ---------- sections */
.section{padding-top:48px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px}
.sec-head h2{font-size:24px}
.sec-head a{font-weight:700;color:var(--brand);font-size:14px;white-space:nowrap}
.banners{display:grid;grid-template-columns:1.6fr 1fr;grid-template-rows:repeat(2,minmax(128px,auto));gap:14px;padding-top:8px}
.banner{position:relative;overflow:hidden;border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.banner:first-child{grid-row:span 2;padding:30px}
.banner:first-child .b-ad{left:30px;top:24px}
.banner h3{font-size:19px;max-width:15ch;position:relative;z-index:1}
.banner:first-child h3{font-size:clamp(24px,3vw,34px);max-width:13ch}
.banner p{margin:0;font-size:13.5px;opacity:.85;position:relative;z-index:1;max-width:30ch}
.b-emoji{position:absolute;right:4px;top:50%;transform:translateY(-50%) rotate(-12deg);font-size:84px;line-height:1}
.banner:first-child .b-emoji{font-size:170px;right:18px}
.b-ad{position:absolute;top:12px;left:14px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.2);z-index:2}
.b1{background:var(--brand);color:var(--brand-ink)}
.b2{background:var(--accent);color:var(--accent-ink)}
.b3{background:#0E7A58;color:#fff}
.banner:hover h3{text-decoration:underline;text-underline-offset:4px}

.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 2px;margin-right:22px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
.subchip{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.subchip:hover{border-color:var(--ink)}
.subchip .si{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:hsl(var(--h) var(--thumb-s) var(--thumb-l));flex:none}
.subchip b{display:block;font-size:14px;line-height:1.25}
.subchip small{color:var(--muted);font-size:12.5px}

/* ---------- product cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:color-mix(in srgb,var(--ink) 50%,var(--line))}
.thumb{position:relative;aspect-ratio:4/3;background:hsl(var(--h) var(--thumb-s) var(--thumb-l));display:grid;place-items:center}
.thumb-emoji{font-size:52px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.tag-new{position:absolute;top:8px;left:8px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px}
.tag-auto{position:absolute;bottom:8px;left:8px;background:var(--surface);color:var(--ink);font-size:11px;font-weight:700;padding:2px 7px 2px 5px;border-radius:6px;display:flex;align-items:center;gap:3px}
.tag-auto svg{width:13px;height:13px;color:var(--brand)}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-title{font:600 14px/1.35 var(--font-body);letter-spacing:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.price{font:800 17px/1.2 var(--font-display);letter-spacing:-.01em}
.card-seller{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);min-width:0}
.card-seller .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:auto;padding-top:4px}
.star{color:var(--star);font-weight:700}
.sb{flex:none;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;line-height:1.55}
.sb-star{background:var(--accent);color:var(--accent-ink)}
.sb-trusted{background:var(--ok-soft);color:var(--ok)}
.sb-new{background:var(--surface-2);color:var(--muted)}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(172px,190px);gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity;scrollbar-width:thin}
.hscroll>*{scroll-snap-align:start}

.ranks{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,auto);grid-auto-flow:column;column-gap:32px}
.ranks li{border-bottom:1px solid var(--line)}
.rank-item{display:grid;grid-template-columns:40px 52px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 4px}
.rank-item:hover .rank-name{text-decoration:underline;text-underline-offset:3px}
.rank-no{font:800 30px/1 var(--font-display);color:var(--muted);letter-spacing:-.04em;text-align:center}
.ranks li:nth-child(-n+3) .rank-no{color:var(--brand)}
.mini-thumb{width:52px;height:52px;border-radius:11px;display:grid;place-items:center;font-size:26px;background:hsl(var(--h) var(--thumb-s) var(--thumb-l));flex:none}
.mini-thumb.sm{width:44px;height:44px;font-size:22px;border-radius:10px}
.rank-name{font-weight:650;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-sub{font-size:12.5px;color:var(--muted)}
.rank-right{text-align:right}
.rank-right strong{display:block;font-family:var(--font-display);font-size:15px}
.rank-right small{color:var(--ok);font-weight:650;font-size:12px;white-space:nowrap}

.how{margin-top:56px;padding:40px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
.how>h2{font-size:30px;max-width:22ch}
.how>p{color:var(--muted);max-width:60ch;margin-top:8px}
.steps{list-style:none;counter-reset:s;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding:0;margin:26px 0 0}
.steps li{counter-increment:s;position:relative;padding-top:54px}
.steps li::before{content:counter(s);position:absolute;top:0;left:0;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);font:800 17px/40px var(--font-display);text-align:center}
.steps li::after{content:"";position:absolute;top:20px;left:52px;right:-6px;border-top:2px dashed var(--line)}
.steps li:last-child::after{display:none}
.steps h3{font-size:16.5px;margin-bottom:4px}
.steps p{margin:0;color:var(--muted);font-size:14px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px;padding-top:28px;border-top:1px solid var(--line)}
.feature{display:flex;gap:12px}
.fi{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.feature h3{font:700 15.5px/1.3 var(--font-body);letter-spacing:0}
.feature p{margin:3px 0 0;color:var(--muted);font-size:14px}

/* ---------- footer */
.footer{margin-top:72px;border-top:1px solid var(--line);background:var(--surface);padding:40px 0 24px}
.foot-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:28px}
.foot-grid p{margin-top:12px;max-width:38ch;font-size:14px}
.foot-grid h4{font-size:14px;margin:0 0 10px}
.foot-grid ul{list-style:none;padding:0;margin:0;display:grid;gap:7px;font-size:14px;color:var(--muted)}
.foot-grid ul a:hover,.foot-bottom a:hover{color:var(--ink)}
.foot-bottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px 20px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.foot-bottom span{display:flex;gap:16px}
.linkish{border:0;background:none;padding:0;color:inherit;font:inherit}
.linkish:hover{color:var(--ink);text-decoration:underline}

/* ---------- pages */
.page{padding-top:28px}
.page-head{margin-bottom:22px}
.page-head h1{font-size:clamp(28px,3.6vw,38px);font-weight:800;letter-spacing:-.03em}
.page-head p{margin:8px 0 0;color:var(--muted);max-width:62ch}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.shop{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"f t" "f r";gap:14px 28px;align-items:start}
.shop>.toolbar{grid-area:t;margin:0}
.shop>.filters{grid-area:f}
.shop>#results{grid-area:r}
.filters{position:sticky;top:84px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.fgroup{border:0;padding:0;margin:0 0 18px;min-width:0}
.fgroup legend{font-weight:750;font-size:13.5px;margin-bottom:6px;padding:0}
.opt{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px;font-weight:500;cursor:pointer}
.opt input{accent-color:var(--brand);width:16px;height:16px;margin:0;flex:none}
.range{display:flex;gap:8px}
.toolbar{display:flex;gap:10px;margin-bottom:14px}
.search-in{flex:1;position:relative;margin:0 !important}
.search-in svg{position:absolute;left:11px;top:10px;color:var(--muted);pointer-events:none}
.search-in .input{padding-left:38px}
.sort{width:auto;min-width:170px}
.filter-toggle{display:none}
.empty{text-align:center;padding:48px 20px;border:1.5px dashed var(--line);border-radius:16px;color:var(--muted)}
.empty p{max-width:44ch;margin:0 auto 16px}

.detail{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:40px;align-items:start}
.d-thumb{aspect-ratio:1;border-radius:22px;background:hsl(var(--h) var(--thumb-s) var(--thumb-l));display:grid;place-items:center;font-size:clamp(90px,13vw,150px);position:sticky;top:88px}
.d-title{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.025em}
.d-sub{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:14px;margin-top:10px}
.d-price{font:800 36px/1.1 var(--font-display);margin:18px 0 12px;letter-spacing:-.025em}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:650;padding:5px 10px;border-radius:8px;background:var(--surface-2)}
.fact svg{width:15px;height:15px;color:var(--brand)}
.field{display:grid;gap:6px;margin-top:18px;max-width:420px}
.field .hint{font-size:12.5px;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:40px;width:max-content;background:var(--bg)}
.stepper button{width:40px;height:100%;border:0;background:none;display:grid;place-items:center}
.stepper button:hover{background:var(--surface-2)}
.stepper input{width:54px;text-align:center;border:0;background:none;height:100%;font-weight:700;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper.sm{height:32px}
.stepper.sm button{width:32px}
.stepper.sm input{width:36px;font-size:13.5px}
.d-buttons{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;max-width:560px}
.d-buttons .btn{flex:1;min-width:160px}
.safe-note{display:flex;gap:10px;align-items:flex-start;margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-size:13.5px;max-width:560px}
.safe-note svg{flex:none}
.safe-note p{margin:0;color:var(--ink)}
.seller-card{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);max-width:560px}
.avatar{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font:800 16px var(--font-display);background:hsl(var(--h) var(--thumb-s) var(--thumb-l));color:hsl(var(--h) 55% var(--mono-l));flex:none}
.avatar.lg{width:76px;height:76px;border-radius:20px;font-size:28px}
.sc-info{flex:1;min-width:140px}
.sc-name{font-weight:750;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sc-meta{font-size:12.5px;color:var(--muted)}
.dtabs{margin-top:44px}
.tabpanel{max-width:72ch}
.tabpanel h3{font-size:17px;margin:20px 0 8px}
.howlist{margin:0;padding-left:20px;display:grid;gap:6px}
.rev-sum{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.rev-sum .big{font:800 34px/1 var(--font-display)}
.review{padding:14px 0;border-bottom:1px solid var(--line)}
.review-head{display:flex;justify-content:space-between;font-size:13.5px}
.review p{margin:4px 0 0}

/* ---------- panels, rekber, tools */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
.panel-title{font-size:20px}
.rk-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr);gap:28px;align-items:start}
.rk-receipt{position:sticky;top:88px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg label,.seg button{position:relative;text-align:center;padding:9px 8px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);border:0;background:none;margin:0 !important;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked),.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg label:has(input:focus-visible){outline:2.5px solid var(--brand)}
.ftable{width:100%;border-collapse:collapse;font-size:14px}
.ftable th,.ftable td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.ftable th{font-size:13px;color:var(--muted);font-weight:700}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}
.faq summary{font-weight:700;cursor:pointer}
.faq details p{margin:8px 0 0;color:var(--muted)}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.tools-grid .panel p.muted{font-size:14px;margin:4px 0 0}
.out{padding:14px;border-radius:12px;background:var(--surface-2);display:grid;gap:6px;font-size:14px}
.out div{display:flex;justify-content:space-between;gap:12px}
.out .hl{font-weight:800;font-size:15.5px}

/* ---------- board */
.board-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.board-top .page-head{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.thread{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.thread summary{list-style:none;display:flex;gap:16px;align-items:center;padding:14px 18px;cursor:pointer}
.thread summary::-webkit-details-marker{display:none}
.thread[open] summary{border-bottom:1px solid var(--line)}
.th-main{flex:1;min-width:0}
.th-title{font-weight:700;font-size:15.5px;display:block}
.th-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin-top:4px}
.pill-cat{font-weight:700;color:var(--brand)}
.pin{display:inline-block;font-size:11px;font-weight:800;background:var(--accent);color:var(--accent-ink);padding:1px 6px;border-radius:5px;margin-right:8px;vertical-align:2px}
.th-stats{text-align:center;min-width:64px}
.th-stats strong{display:block;font:800 20px/1.1 var(--font-display)}
.th-stats small{font-size:11.5px;color:var(--muted)}
.th-body{padding:4px 18px 16px}
.th-body>p{margin:14px 0}
.th-link{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:650;color:var(--brand);margin-bottom:8px}
.reply{display:flex;gap:10px;padding:10px 0;border-top:1px dashed var(--line);font-size:14px}
.av-sm{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--surface-2)}
.reply b{font-size:13px}
.reply p{margin:2px 0 0}
.reply-form{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
.reply-form textarea{flex:1}

/* ---------- seller */
.seller-hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.seller-hero .grow{flex:1;min-width:200px}
.seller-hero h1{font-size:clamp(24px,3vw,32px);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0}
.stat dt{font-size:12.5px;color:var(--muted)}
.stat dd{margin:2px 0 0;font:800 20px/1.2 var(--font-display)}

/* ---------- orders */
.order{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.order header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.inv{font:750 16px var(--font-display);letter-spacing:0}
.pill{font-size:12.5px;font-weight:750;padding:4px 10px;border-radius:999px;white-space:nowrap}
.st-held,.st-await{background:var(--brand-soft);color:var(--brand)}
.st-sent{background:color-mix(in srgb,var(--accent) 24%,var(--surface));color:var(--sent)}
.st-done{background:var(--ok-soft);color:var(--ok)}
.st-complain{background:var(--danger-soft);color:var(--danger)}
.o-items{margin:12px 0;font-size:14px;display:grid;gap:6px}
.o-item{display:flex;justify-content:space-between;gap:12px}
.timeline{list-style:none;padding:0;margin:14px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.timeline li{padding-top:10px;font-size:12.5px;color:var(--muted);border-top:4px solid var(--line);border-radius:2px}
.timeline li.done{border-top-color:var(--ok);color:var(--ink)}
.timeline li.cur{border-top-color:var(--brand);color:var(--ink);font-weight:700}
.timeline li.bad{border-top-color:var(--danger);color:var(--danger);font-weight:700}
.order footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.o-actions{display:flex;gap:8px;flex-wrap:wrap}
.o-note{font-size:13px;color:var(--muted);margin:10px 0 0}

/* ---------- dialogs */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:18px;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);box-shadow:0 30px 60px -20px rgba(10,14,40,.5)}
dialog[open]{display:block;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.drawer[open]{display:flex;flex-direction:column;overflow:hidden}
dialog::backdrop{background:rgba(10,14,35,.55)}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px 12px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;background:var(--surface)}
.m-head h2{font-size:19px}
.m-body{padding:18px 22px;line-height:1.6}
.drawer .m-body{flex:1 1 auto;min-height:0;overflow-y:auto}
.drawer .m-head,.drawer .m-foot{flex:none}
.m-foot{padding:14px 22px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;z-index:2;background:var(--surface)}
.m-foot>form{flex:1;display:flex;gap:8px}
.drawer{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:min(420px,100vw);max-width:100vw;border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.left{margin:0 auto 0 0}
.drawer[open]{animation:slidein .2s ease-out}
.drawer.left[open]{animation-name:slideinl}
@keyframes slidein{from{transform:translateX(30px);opacity:.3}}
@keyframes slideinl{from{transform:translateX(-30px);opacity:.3}}
.menu-nav{display:grid;gap:2px}
.menu-nav a{padding:12px 12px;border-radius:10px;font-weight:650;font-size:16px}
.menu-nav a[aria-current="page"],.menu-nav a:hover{background:var(--surface-2)}
.menu-extra{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:12px}
.cart-item{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.cart-item .ci-name{font-weight:650;font-size:14px;line-height:1.35}
.ci-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.ci-rm{color:var(--muted)}
.ci-rm:hover{color:var(--danger)}
.cart-foot{display:grid;gap:12px;justify-content:stretch}
.cart-foot .sum{display:flex;justify-content:space-between;font-weight:700}
.co-item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.co-name{font-weight:650;font-size:14px;line-height:1.35}
.co-gid{display:block;margin-top:8px;font-size:12.5px;font-weight:650}
.co-gid .input{height:34px;margin-top:4px;font-size:14px}
.paym{display:grid;gap:8px}
.paym label{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;margin:0}
.paym label>span{flex:1;display:grid}
.paym small{font-weight:500;color:var(--muted);font-size:12.5px}
.paym input{accent-color:var(--brand);width:17px;height:17px;margin:0}
.paym label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.paym label.dis{cursor:not-allowed}
.paym label.dis>span{opacity:.6}
.totals{display:grid;gap:6px;margin-top:16px;font-size:14px}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-weight:800;font-size:16px;padding-top:10px;margin-top:4px;border-top:1px dashed var(--line)}
.safe-inline{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ok);margin:14px 0 0}
.safe-inline svg{flex:none;width:17px;height:17px}
.pay-box{text-align:center;display:grid;justify-items:center;gap:8px}
.qr{background:#fff;padding:10px;border-radius:14px;border:1px solid var(--line);line-height:0}
.big-total{font:800 28px/1.1 var(--font-display);margin:4px 0 0}
.va{display:flex;align-items:center;gap:10px;font:700 22px var(--font-mono);letter-spacing:.04em}
.success{text-align:center;display:grid;justify-items:center;gap:8px}
.success .ok-ic{width:60px;height:60px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.success .ok-ic svg{width:30px;height:30px}
.amounts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.amounts label{margin:0;position:relative}
.amounts input{position:absolute;opacity:0}
.amounts span{display:block;text-align:center;padding:11px;border:1.5px solid var(--line);border-radius:10px;font-weight:700}
.amounts input:checked+span{border-color:var(--brand);background:var(--brand-soft)}
.amounts input:focus-visible+span{outline:2.5px solid var(--brand)}
.note{background:var(--brand-soft);padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600}
.chatlog{display:flex;flex-direction:column;gap:8px;height:min(360px,50dvh);overflow:auto}
.msg{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.45}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:var(--ok-soft);color:var(--ok);font-size:12.5px;text-align:center;max-width:100%;font-weight:600}
.msg.typing{color:var(--muted);font-style:italic}
.counter{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}

#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:100;width:min(440px,calc(100vw - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:12px 14px 12px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 14px 30px -12px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:auto;animation:toastin .2s ease-out}
.toast button{border:0;background:none;color:inherit;font-weight:800;text-decoration:underline;padding:0;flex:none}
@keyframes toastin{from{transform:translateY(8px);opacity:0}}

/* ---------- logo, S&K, panel admin */
.pimg{display:block;object-fit:contain}
.thumb .pimg{width:84px;height:84px;border-radius:20px}
.d-thumb .pimg{width:46%;height:auto;aspect-ratio:1;border-radius:22%}
.mini-thumb .pimg,.si .pimg{width:80%;height:80%;border-radius:22%}
.mini-thumb.lg{width:104px;height:104px;border-radius:24px;font-size:52px}
.rich p{margin:0 0 .7em}
.rich .howlist{margin:0 0 .8em}
.rich>:last-child{margin-bottom:0}
.terms{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 18px}
.snk-hint{font-size:13px;color:var(--muted);margin:10px 0 0;max-width:560px}
.snk-hint button{color:var(--brand);font-weight:700}
.co-snk{grid-column:1/-1;margin-top:2px;font-size:13.5px}
.co-snk summary{cursor:pointer;color:var(--brand);font-weight:700}
.co-snk .rich{margin-top:6px;padding:10px 12px;background:var(--surface-2);border-radius:10px}
.tabs .tab-a{padding:10px 2px;margin-right:22px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs .tab-a[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.plist{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.prow{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.prow .grow{flex:1;min-width:0;display:grid;gap:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags:empty{display:none}
.app-grid{grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr))}
.app-grid .subchip{align-items:flex-start}
.tags .pill{font-size:11.5px;padding:2px 8px}
.st-off{background:var(--surface-2);color:var(--muted)}
.logo-box{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.savebar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);margin:4px -24px -24px;padding:14px 24px;border-radius:0 0 18px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:2}
@media (max-width:640px){.savebar{margin:4px -18px -18px;padding:12px 18px}.prow{flex-wrap:wrap}.prow .btn{width:100%}}
.only-mobile{display:none !important}
@media (max-width:1040px){
  .mainnav{display:none}
  .only-mobile{display:grid !important}
  .topsearch{max-width:none}
}
@media (max-width:860px){
  .hero{grid-template-columns:minmax(0,1fr);gap:30px;padding-top:30px}
  .receipt-area{max-width:440px;justify-self:stretch;margin:0 auto}
  .r-lines{height:190px}
  .steps{grid-template-columns:1fr 1fr}
  .steps li::after{display:none}
  .features{grid-template-columns:1fr}
  .detail{grid-template-columns:minmax(0,1fr);gap:24px}
  .d-thumb{position:static;aspect-ratio:16/10}
  .rk-grid,.two-col{grid-template-columns:minmax(0,1fr)}
  .rk-receipt{position:static}
  .ranks{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}
  .foot-grid{grid-template-columns:1fr 1fr}
  .foot-grid>div:first-child{grid-column:1/-1}
  .stats{grid-template-columns:1fr 1fr}
  .shop{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"t" "f" "r"}
  .filters{display:none;position:static}
  .filters.open{display:block}
  .filter-toggle{display:inline-flex}
}
@media (max-width:760px){
  .banners{grid-template-columns:repeat(3,86%);grid-template-rows:auto;grid-auto-flow:column;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;padding-bottom:6px;scrollbar-width:none}
  .banner,.banner:first-child{grid-row:auto;min-height:0;scroll-snap-align:start;padding:62px 22px 22px;justify-content:flex-start}
  .banner .b-emoji,.banner:first-child .b-emoji{font-size:46px;right:16px;top:12px;transform:rotate(-12deg)}
  .banner:first-child .b-ad,.b-ad{left:22px;top:20px}
  .banner:first-child h3{font-size:24px}
}
@media (max-width:640px){
  .wrap{padding-left:16px;padding-right:16px}
  .topbar-in{gap:6px}
  .topsearch,.lang{display:none}
  .top-actions{margin-left:auto}
  .userbtn .bal{display:none}
  .userbtn{padding-right:3px}
  .how{padding:26px 18px;margin-top:44px}
  .how>h2{font-size:24px}
  .steps{grid-template-columns:1fr}
  .bigsearch select{display:none}
  .bigsearch .btn span{display:none}
  .bigsearch .btn{padding:0 14px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .thumb-emoji{font-size:44px}
  .card-body{padding:9px 10px 11px}
  .foot-grid{grid-template-columns:1fr}

function rekberFee(n){ return clamp(Math.round(n * 0.025), 2000, 100000); }
function feeSplit(amount, payer){
  const fee = rekberFee(amount);
  const b = payer === 'buyer' ? fee : payer === 'split' ? Math.ceil(fee / 2) : 0;
  const s = payer === 'seller' ? fee : payer === 'split' ? Math.floor(fee / 2) : 0;
  return { fee, buyerPays: amount + b, sellerGets: amount - s };
}

function richText(text){
  let html = '', list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of String(text || '').split(/\r?\n/)) {
    const l = raw.trim(); let m;
    if ((m = l.match(/^[-•*]\s+(.*)/))) { if (list !== 'ul') { close(); html += '<ul class="howlist">'; list = 'ul'; } html += `<li>${esc(m[1])}</li>`; }
    else if ((m = l.match(/^\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); html += '<ol class="howlist">'; list = 'ol'; } html += `<li>${esc(m[1])}</li>`; }
    else { close(); if (l) html += `<p>${esc(l)}</p>`; }
  }
  close();
  return `<div class="rich">${html || '<p class="muted">(kosong)</p>'}</div>`;
}

const TICK = { lines: [], count: 1284, held: 38200000 };
function clockStr(){
  const d = new Date(); const D = ['MINGGU','SENIN','SELASA','RABU','KAMIS','JUMAT','SABTU'];
  return `${D[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${hhmmss(d)}`;
}
function newTickLine(secAgo){
  const pool = PRODUCTS.filter(p => p.sold24 > 0);
  const p = pool[Math.floor(Math.random() * pool.length)];
  const qty = Math.random() < .85 ? 1 : 2;
  return { time: hhmmss(new Date(Date.now() - secAgo * 1000)), buyer: mask(BUYERS[Math.floor(Math.random() * BUYERS.length)]), name: p.name, total: p.price * qty, qty, st: Math.random() < .7 ? 'held' : 'done' };
}
for (let i = 0; i < 5; i++) TICK.lines.push(newTickLine(6 + i * 19));
const tickLineHTML = (l, anim) => `<li class="r-line${anim ? ' print' : ''}"><div class="r-top"><span>${l.time}</span><span>${esc(l.buyer)}</span></div><div class="r-mid"><span class="r-name">${l.qty > 1 ? l.qty + 'X ' : ''}${esc(l.name)}</span><span>${num(l.total)}</span></div><div class="r-st ${l.st}"><span>${l.st === 'held' ? 'DITAHAN REKBER' : 'SELESAI'}</span></div></li>`;
function receiptHTML(){
  return `<div class="receipt-wrap" role="region" aria-label="Transaksi live">
    <div class="printer" aria-hidden="true"></div>
    <div class="receipt">
      <div class="r-head"><strong>SAPECC</strong><div>STRUK TRANSAKSI LIVE</div><div id="r-clock">${clockStr()}</div></div>
      <div class="r-sep"></div>
      <ol class="r-lines" id="r-lines">${TICK.lines.map(l => tickLineHTML(l)).join('')}</ol>
      <div class="r-sep"></div>
      <div class="r-row"><span>TRANSAKSI HARI INI</span><span id="r-count">${num(TICK.count)}</span></div>
      <div class="r-row"><span>DANA DI REKBER</span><span id="r-held">${rpShort(TICK.held)}</span></div>
      <div class="r-foot">Dana baru diteruskan ke penjual setelah pembeli konfirmasi.</div>
    </div></div>`;
}
function addTick(){
  const l = newTickLine(0);
  TICK.lines.unshift(l); TICK.lines = TICK.lines.slice(0, 5);
  TICK.count++;
  TICK.held = l.st === 'held' ? TICK.held + l.total : Math.max(20000000, TICK.held - l.total);
  const ol = $('#r-lines');
  if (!ol) return;
  const tmp = document.createElement('ol'); tmp.innerHTML = tickLineHTML(l, true);
  ol.prepend(tmp.firstElementChild);
  while (ol.children.length > 5) ol.lastElementChild.remove();
  $('#r-count').textContent = num(TICK.count);
  $('#r-held').textContent = rpShort(TICK.held);
}

function filterProducts(f){
  let list = PRODUCTS.filter(p => (!f.cat || p.cat === f.cat) && (!f.sub || p.sub === f.sub));
  if (f.q) {
    const words = f.q.toLowerCase().split(/\s+/).filter(Boolean);
    list = list.filter(p => {
      const hay = [p.name, SELLERS[p.seller].name, subName(p), CAT(p.cat).name, p.k].join(' ').toLowerCase();
      return words.every(w => hay.includes(w));

  if (f.min) list = list.filter(p => p.price >= +f.min);
  if (f.max) list = list.filter(p => p.price <= +f.max);
  if (f.badge) { const bs = f.badge.split(','); list = list.filter(p => bs.includes(SELLERS[p.seller].badge)); }
  if (f.auto === '1') list = list.filter(p => p.auto);
  const sorters = {
    popular:(a, b) => b.sold - a.sold, latest:(a, b) => a.age - b.age,
    rating:(a, b) => (b.rating - a.rating) || (b.reviews - a.reviews),
    cheap:(a, b) => a.price - b.price, pricey:(a, b) => b.price - a.price
  };
  return list.sort(sorters[f.sort] || sorters.popular);
}
function updateResults(push = true){

function reviewsHTML(p){
  if (!p.reviews) return `<p class="muted">Belum ada ulasan. Pembeli bisa memberi ulasan setelah pesanan selesai.</p>`;
  const r = rng(hash(p.id)); const pool = REVIEWS[p.cat];
  let out = `<div class="rev-sum"><span class="big">${p.rating.toFixed(1)}</span><span class="muted">dari 5, berdasarkan ${num(p.reviews)} ulasan</span></div>`;
  for (let i = 0; i < Math.min(4, p.reviews); i++) {
    const nm = BUYERS[Math.floor(r() * BUYERS.length)];
    const stars = r() < .82 ? 5 : 4;
    const txt = pool[(i + Math.floor(r() * pool.length)) % pool.length];
    const days = 1 + Math.floor(r() * 6) + i * 4;
    out += `<div class="review"><div class="review-head"><strong>${mask(nm)}</strong><span class="muted">${days} hari lalu</span></div><div class="star" role="img" aria-label="${stars} dari 5 bintang">${'★'.repeat(stars)}${'☆'.repeat(5 - stars)}</div><p>${txt}</p></div>`;
  }
  return out;
}

function toolPrice(){

  if (cost < 1000) { $('#tprice-out').innerHTML = `<div><span class="muted">Isi harga modal dulu.</span></div>`; return; }

  const n = DONE_N[o.role][o.status] ?? 0;
  const steps = STEPS[o.role].map((s, i) => {
    let cls = i < n ? 'done' : i === n ? 'cur' : '';
    if (o.status === 'complain' && i === n) cls = 'bad';
    return `<li class="${cls}">${s}</li>`;
  }).join('');
  const items = o.type === 'rekber'
    ? `<div class="o-item"><span>${esc(o.name)} <span class="muted">dengan @${esc(o.cp)}</span></span><span>${rp(o.amount)}</span></div><div class="o-item muted small"><span>Biaya rekber (${{ buyer:'pembeli', seller:'penjual', split:'dibagi dua' }[o.payer]})</span><span>${rp(o.fee)}</span></div>`
    : o.items.map(it => `<div class="o-item"><span>${it.qty}× ${esc(it.name)}${it.gid ? ` <span class="muted">(ID ${esc(it.gid)})</span>` : ''}</span><span>${rp(it.price * it.qty)}</span></div>`).join('') + `<div class="o-item muted small"><span>Biaya layanan dan pembayaran</span><span>${rp(o.fee)}</span></div>`;
  let actions = '';
  if (o.role === 'buyer') {
    if (o.status === 'sent') actions = `<button class="btn btn-sm btn-outline" data-act="complain" data-id="${o.id}">Ajukan komplain</button><button class="btn btn-sm btn-primary" data-act="confirm-recv" data-id="${o.id}">Pesanan diterima</button>`;
    else if (o.status === 'held' && o.seller) actions = `<button class="btn btn-sm btn-outline" data-act="chat" data-seller="${o.seller}">${ICON.chat}${t('chat')}</button>`;
    else if (o.status === 'done' && o.items) actions = `<a class="btn btn-sm btn-outline" href="#/p/${o.items[0].pid}">Beli lagi</a>`;
  } else if (o.status === 'held') {
    actions = `<button class="btn btn-sm btn-primary" data-act="mark-sent" data-id="${o.id}">Tandai sudah dikirim</button>`;
  }
  const total = o.role === 'seller' ? `Kamu terima <strong>${rp(o.sellerGets)}</strong>` : `Total <strong>${rp(o.total)}</strong> <span class="muted small">lewat ${METHOD[o.method] || o.method}</span>`;
  return `<article class="order" id="o-${o.id}">
    <header><div><div class="inv">${o.id}</div><div class="muted small">${fmtDate(o.created)}${o.type === 'rekber' ? ', rekber langsung' : ''}</div></div><span class="pill st-${o.status}">${stLabel(o)}</span></header>
    <div class="o-items">${items}</div>
    <ol class="timeline" aria-label="Status">${steps}</ol>
    ${o.status === 'complain' ? `<p class="o-note">Admin meninjau komplainmu. Dana tetap ditahan sampai ada keputusan.</p>` : ''}
    <footer><div>${total}</div><div class="o-actions">${actions}</div></footer>
  </article>`;
}

// Gambar diperkecil di browser supaya muat di penyimpanan dan cepat dimuat pelanggan.
function readImage(file, max = 256){
  return new Promise((resolve, reject) => {
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return reject(new Error('Pakai gambar PNG, JPG, atau WebP.'));
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let data = c.toDataURL('image/webp', 0.9);
      if (!data.startsWith('data:image/webp') || data.length > 180000) data = c.toDataURL(file.type === 'image/jpeg' ? 'image/jpeg' : 'image/png', 0.88);
      if (data.length > 180000) data = c.toDataURL('image/jpeg', 0.8);
      resolve(data);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Gambar tidak bisa dibaca.')); };
    img.src = url;
  });
}

const NAVLINKS = [['', 'home'], ['produk', 'products'], ['diskusi', 'disc'], ['forum', 'forum'], ['rekber', 'escrow'], ['tools', 'tools']];
const route = () => parseHash().parts[0] || '';
function parseHash(){
  const h = location.hash.slice(1) || '/';
  const [path, qs] = h.split('?');
  return { parts: path.split('/').filter(Boolean), q: Object.fromEntries(new URLSearchParams(qs || '')) };
}
const navRoute = r => (r === 'p' || r === 'toko') ? 'produk' : r === 'pesanan' ? '' : r;
function go(h){ if (location.hash === h) render(); else location.hash = h; }
let lastPath = null;
function render(){
  const { parts, q } = parseHash();
  const r = parts[0] || '';
  document.body.dataset.route = r || 'home';
  document.title = 'Sapecc - Marketplace Produk Digital';
  let html;
  switch (r) {
    case '': html = viewHome(); break;
    case 'produk': html = viewProducts(q); break;
    case 'p': html = viewDetail(parts[1]); break;
    case 'toko': html = viewSeller(parts[1]); break;
    case 'diskusi': case 'forum': html = viewBoard(r, q); break;
    case 'rekber': html = viewRekber(); break;
    case 'tools': html = viewTools(); break;
    case 'pesanan': html = viewOrders(); break;
    case 'admin': html = viewAdmin(parts); break;
    default: html = viewNotFound();
  }
  $('#app').innerHTML = html;
  $('#footer').innerHTML = footerHTML();
  renderHeader(r);
  if (r === 'produk') updateResults(false);
  if (r === 'rekber') updateRekber();
  if (r === 'tools') { toolFee(); toolPrice(); }
  const path = parts.join('/');
  if (path !== lastPath) { window.scrollTo(0, 0); lastPath = path; }
}

function openCart(){
  const items = S.cart.map((it, i) => { const p = P(it.pid); if (!p) return ''; return `<div class="cart-item"><span class="mini-thumb sm" style="--h:${p.hue}" aria-hidden="true">${pic(p)}</span><div>
      <a class="ci-name" href="#/p/${p.id}" data-act="close">${esc(p.name)}</a>${it.gid ? `<div class="muted small">ID ${esc(it.gid)}</div>` : ''}
      <div class="ci-row"><div class="stepper sm"><button data-act="cart-qty" data-i="${i}" data-d="-1" aria-label="Kurangi">${ICON.minus}</button><input value="${it.qty}" readonly aria-label="Jumlah" tabindex="-1"><button data-act="cart-qty" data-i="${i}" data-d="1" aria-label="Tambah">${ICON.plus}</button></div>
      <strong>${rp(p.price * it.qty)}</strong><button class="icon-btn ci-rm" data-act="cart-rm" data-i="${i}" aria-label="Hapus ${esc(p.name)}">${ICON.trash}</button></div></div></div>`; }).join('');
  const sub = S.cart.reduce((a, it) => a + (P(it.pid)?.price || 0) * it.qty, 0);
  if (!S.cart.length) openDrawer(t('cart'), `<div class="empty" style="margin-top:12px"><p>${t('cart_empty')} Cari produk yang kamu butuhkan.</p><a class="btn btn-primary" href="#/produk" data-act="close">Lihat produk</a></div>`);
  else openDrawer(`${t('cart')} (${S.cart.reduce((a, i) => a + i.qty, 0)})`, items, `<div class="sum"><span>Subtotal</span><span>${rp(sub)}</span></div><button class="btn btn-primary btn-lg btn-block" data-act="cart-checkout">${t('checkout')}</button>`);
}
function addToCart(pid, qty, gid){
  const p = P(pid);
  const ex = S.cart.find(i => i.pid === pid && (i.gid || '') === (gid || ''));
  if (ex) ex.qty = Math.min(p.stock, ex.qty + qty); else S.cart.push({ pid, qty, gid: gid || '' });
  save('cart'); renderHeader();
  toast(`Masuk keranjang: ${esc(p.name)}`, { act:'cart', label:'Lihat' });
}

/* ----- checkout ----- */
let CO = null;
const coSub = () => CO.items.reduce((a, it) => a + P(it.pid).price * it.qty, 0);
function coTotals(m){
  const sub = coSub(); const svc = 1000;
  const pay = m === 'qris' ? Math.round(sub * 0.007) : m === 'va' ? 2500 : 0;
  return { sub, svc, pay, total: sub + svc + pay };
}
function totalsHTML(m){
  const x = coTotals(m);
  return `<div><span>Subtotal</span><span>${rp(x.sub)}</span></div><div><span>Biaya layanan</span><span>${rp(x.svc)}</span></div>${x.pay ? `<div><span>Biaya ${m === 'qris' ? 'QRIS' : 'virtual account'}</span><span>${rp(x.pay)}</span></div>` : ''}<div class="grand"><span>Total bayar</span><span>${rp(x.total)}</span></div>`;
}
function openCheckout(items, source){
  if (!items.length) return;
  if (!S.user) { if (drawer.open) drawer.close(); openAuth('login', () => openCheckout(items, source), 'Masuk dulu untuk lanjut ke pembayaran.'); return; }
  CO = { items: items.map(i => ({ ...i })), source, method: null };
  if (drawer.open) drawer.close();
  renderCheckout();
}
function renderCheckout(){
  const canSaldo = S.user.saldo >= coSub() + 1000;
  if (!CO.method || (CO.method === 'saldo' && !canSaldo)) CO.method = canSaldo ? 'saldo' : 'qris';
  const m = CO.method;
  const items = CO.items.map((it, i) => { const p = P(it.pid); return `<div class="co-item"><span class="mini-thumb sm" style="--h:${p.hue}" aria-hidden="true">${pic(p)}</span><div><div class="co-name">${esc(p.name)}</div><div class="muted small">${it.qty} × ${rp(p.price)}</div>${p.cat === 'game' ? `<label class="co-gid">ID pemain dan server<input class="input" name="gid-${i}" value="${esc(it.gid || '')}" placeholder="12345678 (2011)" autocomplete="off"></label>` : ''}</div><strong>${rp(p.price * it.qty)}</strong>${p.terms && p.terms.trim() ? `<details class="co-snk"><summary>Lihat S&amp;K produk ini</summary>${richText(p.terms)}</details>` : ''}</div>`; }).join('');
  const methods = [
    ['saldo', 'Saldo Sapecc', canSaldo ? `Saldo kamu ${rp(S.user.saldo)}` : `Saldo ${rp(S.user.saldo)}, belum cukup`, !canSaldo],
    ['qris', 'QRIS', 'Aplikasi bank dan dompet digital, biaya 0,7%', false],
    ['va', 'Transfer virtual account', 'Semua bank, biaya Rp 2.500', false]
  ];
  openModal('Pembayaran', `<form id="co-form" data-form="checkout" novalidate>
    <div>${items}</div>
    ${CO.items.some(it => P(it.pid).terms && P(it.pid).terms.trim()) ? `<label class="opt" style="margin-top:14px"><input type="checkbox" name="agree"> Saya sudah membaca S&amp;K ${CO.items.filter(it => P(it.pid).terms && P(it.pid).terms.trim()).length > 1 ? 'setiap produk' : 'produk'} di atas</label>` : ''}
    <fieldset class="fgroup" style="margin:18px 0 0"><legend>Metode pembayaran</legend><div class="paym">${methods.map(([v, l, d, dis]) => `<label class="${dis ? 'dis' : ''}"><input type="radio" name="method" value="${v}" ${v === m ? 'checked' : ''} ${dis ? 'disabled' : ''}><span><b>${l}</b><small>${d}</small></span>${v === 'saldo' && dis ? `<button type="button" class="btn btn-sm btn-accent" data-act="topup" data-from="co">Top up</button>` : ''}</label>`).join('')}</div></fieldset>
    <div class="totals" id="co-totals">${totalsHTML(m)}</div>
    <p class="safe-inline">${ICON.shield}<span>Dana ditahan rekber sampai kamu konfirmasi pesanan diterima.</span></p>
    <p class="err" id="co-err" role="alert" hidden></p>
  </form>`, `<button class="btn btn-primary btn-lg btn-block" type="submit" form="co-form" id="co-pay">Bayar ${rp(coTotals(m).total)}</button>`);
}
function qrSVG(seed){
  const n = 25, r = rng(hash(seed)); let d = '';
  const inF = (x, y) => (x < 8 && y < 8) || (x >= n - 8 && y < 8) || (x < 8 && y >= n - 8);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { if (!inF(x, y) && r() < .5) d += `M${x} ${y}h1v1h-1z`; }
  const f = (x, y) => `<rect x="${x + .5}" y="${y + .5}" width="6" height="6" fill="none" stroke="#000"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
  return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" width="196" height="196" role="img" aria-label="Kode QR contoh" shape-rendering="crispEdges"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#fff"/><g fill="#000"><path d="${d}"/>${f(0, 0)}${f(n - 7, 0)}${f(0, n - 7)}</g></svg>`;
}
function vaNum(seed){ const s = ('8808' + String(hash(seed)).padStart(10, '0') + String(hash(seed + 'x')).slice(0, 2)).slice(0, 16); return s; }
function payStep(){
  const m = CO.method; const tot = coTotals(m);
  CO.inv = CO.inv || invId();
  const va = vaNum(CO.inv);
  const body = m === 'qris'
    ? `<div class="pay-box"><div class="qr">${qrSVG(CO.inv)}</div><p class="big-total">${rp(tot.total)}</p><p class="muted" style="margin:0">Scan pakai aplikasi bank atau dompet digital. Kode berlaku 15 menit.</p></div>`
    : `<div class="pay-box"><p class="muted" style="margin:0">Nomor virtual account</p><div class="va"><span>${va.replace(/(\d{4})(?=\d)/g, '$1 ')}</span><button class="btn btn-sm btn-outline" data-act="copy" data-text="${va}">Salin</button></div><p class="big-total">${rp(tot.total)}</p><p class="muted" style="margin:0">Transfer tepat sesuai nominal sebelum pukul 23.59.</p></div>`;
  openModal(m === 'qris' ? 'Bayar dengan QRIS' : 'Bayar lewat virtual account',
    body + `<p class="demo-note" style="margin-top:16px;text-align:center">Situs demo: ${m === 'qris' ? 'kode QR ini contoh dan tidak bisa dipakai membayar' : 'nomor ini contoh dan tidak bisa menerima transfer'}.</p>`,
    `<button class="btn btn-outline" data-act="co-back">Ganti metode</button><button class="btn btn-primary" data-act="co-paid">Saya sudah bayar</button>`);
}
function finalize(){
  const m = CO.method; const tot = coTotals(m);
  if (m === 'saldo') {
    if (S.user.saldo < tot.total) { CO.method = null; renderCheckout(); return; }
    addSaldo(-tot.total);
  }
  const o = { id: CO.inv || invId(), type:'order', role:'buyer', created: Date.now(), method: m, seller: P(CO.items[0].pid).seller,
    items: CO.items.map(it => { const p = P(it.pid); return { pid: p.id, name: p.name, qty: it.qty, price: p.price, gid: it.gid || '' }; }),
    sub: tot.sub, fee: tot.svc + tot.pay, total: tot.total, history: [] };
  setStatus(o, 'held');
  S.orders.unshift(o); save('orders');
  if (CO.source === 'cart') { S.cart = []; save('cart'); }
  CO = null; renderHeader();
  if (parseHash().parts[0] === 'pesanan') render();
  openModal('Pembayaran diterima', `<div class="success"><span class="ok-ic">${ICON.check}</span><p class="big-total">${rp(o.total)}</p><p style="margin:0">Dana kamu ditahan rekber. Penjual akan memproses pesanan, dan kami kabari saat pesanan dikirim.</p><p class="muted small" style="margin:0">Nomor invoice <strong class="mono">${o.id}</strong></p></div>`,
    `<button class="btn btn-outline" data-act="close">Lanjut belanja</button><a class="btn btn-primary" href="#/pesanan" data-act="close">Lihat pesanan</a>`);
}

/* ----- order state machine ----- */
function setStatus(o, s){
  o.status = s; o.history.push({ s, t: Date.now() }); o.next = null;
  const now = Date.now();
  if (o.role === 'buyer' && s === 'held') o.next = { s:'sent', at: now + 7000 };
  if (o.role === 'seller' && s === 'await') o.next = { s:'held', at: now + 7000 };
  if (o.role === 'seller' && s === 'sent') o.next = { s:'done', at: now + 8000 };
  if (o.role === 'seller' && s === 'done') addSaldo(o.sellerGets);
}
function autoMsg(o){
  if (o.role === 'buyer' && o.status === 'sent') return `Penjual sudah mengirim pesanan ${o.id}. Cek lalu konfirmasi.`;
  if (o.role === 'seller' && o.status === 'held') return `Pembeli sudah membayar ${o.id}. Silakan kirim pesanan.`;
  if (o.role === 'seller' && o.status === 'done') return `Pembeli mengonfirmasi ${o.id}. ${rp(o.sellerGets)} masuk ke saldomu.`;
  return `Status ${o.id} berubah.`;
}
const findOrder = id => S.orders.find(o => o.id === id);

const chatLogHTML = slug => CHATS[slug].map(m => `<div class="msg ${m.from}">${esc(m.text)}</div>`).join('');
function openChat(slug, pid){
  const s = SELLERS[slug]; const p = pid ? P(pid) : null;

    { from:'sys', text:'Jangan bayar lewat chat atau transfer ke rekening pribadi. Semua pembayaran lewat Sapecc.' },

    `<form data-form="chat" data-seller="${slug}"><label class="sr" for="chat-in">Pesan</label><input class="input" id="chat-in" name="text" autocomplete="off" placeholder="Tulis pesan" maxlength="400"><button class="btn btn-primary">Kirim</button></form>`);

}

function detailInputs(p){
  let gid = '';
  if (p.cat === 'game') {
    const g = $('#gid'); gid = g.value.trim();
    if (gid.length < 4) { $('#gid-err').hidden = false; g.setAttribute('aria-invalid', 'true'); g.focus(); return null; }
    $('#gid-err').hidden = true; g.removeAttribute('aria-invalid');
  }
  const qty = clamp(parseInt($('#qty').value) || 1, 1, p.stock);
  return { gid, qty };
}
const showErr = (sel, msg) => { const e = $(sel); if (e) { e.textContent = msg; e.hidden = false; } };

/* ================= forms ================= */
const FORMS = {
  adminsave: async (f, btn) => {
    if (!DB) return showErr('#aed-err', 'Penyimpanan belum tersambung. Buka halaman ini dari claude.ai.');
    const name = f.elements.pname.value.trim(), desc = f.elements.desc.value.trim(), terms = f.elements.terms.value.trim(), icon = f.elements.icon.value.trim() || '📦';
    if (name.length < 5) return showErr('#aed-err', 'Nama produk minimal 5 karakter.');
    if (desc.length < 10) return showErr('#aed-err', 'Deskripsi minimal 10 karakter.');
    $('#aed-err').hidden = true; if (btn) btn.disabled = true;
    try {
      await DB.collection('data/admin/products').doc(AED.id).set({ name, desc, terms, icon, image: AED.image, active: f.elements.active.checked, updatedAt: Date.now() });
      AED.dirty = false; $('#aed-state').textContent = 'Tersimpan';
      toast('Perubahan disimpan. Pelanggan sudah bisa melihatnya.');
    } catch (e) {
      showErr('#aed-err', e && e.code === 'not_granted' ? 'Akunmu tidak punya izin untuk menyimpan.' : e && (e.code === 'invalid_argument' || e.code === 'quota_exceeded') ? 'Data terlalu besar. Coba logo dengan ukuran lebih kecil.' : 'Gagal menyimpan. Coba lagi.');
    } finally { if (btn) btn.disabled = false; }
  },
  search: f => {
    const q = f.elements.q.value.trim(); const cat = f.elements.cat ? f.elements.cat.value : '';
    const p = new URLSearchParams(); if (q) p.set('q', q); if (cat) p.set('cat', cat);
    go('#/produk' + (p.toString() ? '?' + p : ''));
  },
  filters: () => {},
  tool: () => {},
  auth: f => {
    const mode = f.elements.mode.value; const email = f.elements.email.value.trim().toLowerCase(); const pass = f.elements.pass.value;
    const name = mode === 'register' ? f.elements.name.value.trim() : '';
    if (mode === 'register' && name.length < 2) return showErr('#auth-err', 'Isi nama minimal 2 huruf.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showErr('#auth-err', 'Format email belum benar. Contoh: nama@email.com');
    if (pass.length < 6) return showErr('#auth-err', 'Kata sandi minimal 6 karakter.');
    const acc = store.get('accounts', {});
    if (mode === 'register' && acc[email]) return showErr('#auth-err', 'Email ini sudah terdaftar. Pilih Masuk.');
    if (!acc[email]) acc[email] = { name: name || email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()), saldo: 0 };
    store.set('accounts', acc);
    S.user = { email, name: acc[email].name, saldo: acc[email].saldo }; save('user');
    const fn = AUTH_THEN; AUTH_THEN = null;
    dlg.close(); render();
    toast(`Halo, ${esc(S.user.name)}!`);
    if (fn) fn();
  },
  topup: f => {
    const custom = parseInt(f.elements.custom.value) || 0;
    const amt = custom || parseInt(f.elements.amt.value) || 0;
    if (amt < 10000) return showErr('#tp-err', 'Nominal minimal Rp 10.000.');
    if (amt > 10000000) return showErr('#tp-err', 'Nominal maksimal Rp 10.000.000 per top up.');
    addSaldo(amt); renderHeader();
    if (TOPUP_FROM === 'co' && CO) { CO.method = null; TOPUP_FROM = null; renderCheckout(); toast(`Saldo bertambah ${rp(amt)}.`); return; }
    dlg.close(); toast(`Saldo bertambah ${rp(amt)}.`);
    if (parseHash().parts[0] === 'pesanan') render();
  },
  checkout: f => {
    let bad = false;
    CO.items.forEach((it, i) => {
      const inp = f.elements['gid-' + i];
      if (inp) { it.gid = inp.value.trim(); if (it.gid.length < 4) { bad = true; inp.setAttribute('aria-invalid', 'true'); } else inp.removeAttribute('aria-invalid'); }
    });
    if (bad) return showErr('#co-err', 'Isi ID pemain untuk produk game, minimal 4 karakter.');
    if (f.elements.agree && !f.elements.agree.checked) return showErr('#co-err', 'Centang dulu tanda sudah membaca S&K produk.');
    if (CO.method === 'saldo') finalize(); else payStep();
  },
  chat: f => {
    const text = f.elements.text.value.trim(); if (!text) return;
    const slug = f.dataset.seller; CHATS[slug].push({ from:'me', text }); f.elements.text.value = '';
    const refresh = () => { const lg = $('#chatlog'); if (lg && lg.dataset.seller === slug) { lg.innerHTML = chatLogHTML(slug); lg.scrollTop = lg.scrollHeight; } };
    refresh();
    const n = CHATS[slug].filter(m => m.from === 'them').length;
    setTimeout(() => { CHATS[slug].push({ from:'them', text: CHAT_REPLIES[(n - 1) % CHAT_REPLIES.length] }); refresh(); }, 1100);
  },
  newthread: f => {
    const title = f.elements.title.value.trim(); const body = f.elements.body.value.trim();
    if (title.length < 5) return showErr('#nt-err', 'Judul minimal 5 karakter.');
    if (body.length < 5) return showErr('#nt-err', 'Isi topik minimal 5 karakter.');
    const b = f.dataset.board;
    (S.threads[b] = S.threads[b] || []).unshift({ id: 'u' + Date.now(), cat: f.elements.cat.value, title, body, by: S.user.name, ts: Date.now(), views: 1, count: 0, replies: [] });
    save('threads'); dlg.close();
    go('#/' + b); toast('Topik diterbitkan.');
  },
  reply: f => {
    const text = f.elements.text.value.trim(); if (!text) { f.elements.text.focus(); return; }
    const id = f.dataset.id;
    if (!S.user) { openAuth('login', null, 'Masuk dulu untuk membalas.'); return; }
    const r = { by: S.user.name, text, ts: Date.now() };
    (S.replies[id] = S.replies[id] || []).push(r); save('replies');
    $('#rp-' + id).insertAdjacentHTML('beforeend', replyHTML(r));
    const rc = $('#rc-' + id); rc.textContent = +rc.textContent + 1;
    f.elements.text.value = '';
  },
  rekber: f => {
    const cp = f.elements.cp.value.trim().replace(/^@/, ''); const item = f.elements.thing.value.trim();
    const amount = parseInt(f.elements.amt.value) || 0; const payer = f.elements.payer.value; const role = f.elements.role.value;
    if (cp.length < 3) return showErr('#rk-err', `Isi username ${role === 'seller' ? 'pembeli' : 'penjual'}, minimal 3 karakter.`);
    if (item.length < 3) return showErr('#rk-err', 'Isi nama barang atau jasa.');
    if (amount < 10000) return showErr('#rk-err', 'Nominal minimal Rp 10.000.');
    if (amount > 50000000) return showErr('#rk-err', 'Nominal maksimal Rp 50.000.000 per transaksi.');
    $('#rk-err').hidden = true;
    const run = () => {
      const x = feeSplit(amount, payer);
      const o = { id: invId(), type:'rekber', role, created: Date.now(), method:'rekber', cp, name: item, note: f.elements.note.value.trim(), amount, fee: x.fee, payer, total: x.buyerPays, sellerGets: x.sellerGets, sub: amount, history: [] };
      setStatus(o, role === 'buyer' ? 'held' : 'await');
      S.orders.unshift(o); save('orders');
      go('#/pesanan'); toast(`Rekber ${o.id} dibuat.`);
    };
    if (!S.user) { openAuth('login', run, 'Masuk dulu untuk membuat transaksi rekber.'); return; }
    run();
  },
  invoice: f => {
    const v = f.elements.inv.value.trim().toUpperCase(); const o = findOrder(v);
    $('#tinv-out').innerHTML = !v ? `<p class="err">Isi nomor invoice dulu.</p>`
      : o ? `<div class="out"><div><span>Status</span><span class="pill st-${o.status}">${stLabel(o)}</span></div><div><span>Dibuat</span><span>${fmtDate(o.created)}</span></div><div class="hl"><span>Total</span><span>${rp(o.total)}</span></div></div>`
      : `<p class="err">Invoice ${esc(v)} tidak ditemukan. Cek lagi penulisannya, contoh: INV-260930-AB12.</p>`;
  },
  complain: f => {
    const reason = f.elements.reason.value.trim();
    if (reason.length < 10) return showErr('#cp-err', 'Jelaskan alasannya minimal 10 karakter supaya admin bisa meninjau.');
    const o = findOrder(f.dataset.id); if (!o) return;
    o.reason = reason; setStatus(o, 'complain'); save('orders'); dlg.close(); render();
    toast('Komplain terkirim. Admin akan meninjau dalam 1×24 jam.');
  }
};

/* ================= global listeners ================= */
document.addEventListener('click', e => {
  const um = $('#umenu');
  if (um && !um.hidden && !e.target.closest('#userbox')) { um.hidden = true; $('.userbtn')?.setAttribute('aria-expanded', 'false'); }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target; const fn = FORMS[f.dataset.form];
  if (!fn) return;
  e.preventDefault(); fn(f);
});
let fDeb;
function onField(e){
  const el = e.target; const form = el.form;
  if (el.id === 'adm-q' || el.id === 'adm-st') {
    ADMIN_FILTER.q = $('#adm-q').value; ADMIN_FILTER.st = $('#adm-st').value;
    $('#adm-rows').innerHTML = adminRows(); return;
  }
  if (e.type === 'change' && el.type === 'file' && el.files && el.files[0]) {
    const file = el.files[0]; el.value = '';
    readImage(file).then(async data => {
      if (el.id === 'aed-file' && AED) { AED.image = data; adminPreview(); toast('Logo siap. Tekan Simpan perubahan.'); }
      else if (el.dataset.app) {
        if (!DB) return toast('Penyimpanan belum tersambung.');
        await DB.collection('data/admin/apps').doc(el.dataset.app.replace('/', '~')).set({ image: data, updatedAt: Date.now() });
        toast('Logo aplikasi disimpan.');
      }
    }).catch(err => toast(esc(err.message || 'Gagal menyimpan logo.')));
    return;
  }
  if (!form) return;
  if (form.id === 'aef') { adminPreview(); return; }
  if (form.id === 'ff') {
    if (el.name === 'cat' && e.type === 'change') { const g = $('#subgroup'); g.innerHTML = subsFieldHTML(el.value, ''); g.hidden = !el.value; }
    clearTimeout(fDeb); fDeb = setTimeout(() => updateResults(true), el.type === 'search' ? 160 : 0);
  } else if (form.id === 'rkf') { updateRekber(); }
  else if (form.id === 'tfee') { toolFee(); }
  else if (form.id === 'tprice') { toolPrice(); }
  else if (form.id === 'co-form' && CO) {
    if (el.name === 'method' && el.checked) { CO.method = el.value; $('#co-totals').innerHTML = totalsHTML(CO.method); $('#co-pay').textContent = 'Bayar ' + rp(coTotals(CO.method).total); }
    if (el.name && el.name.startsWith('gid-')) CO.items[+el.name.slice(4)].gid = el.value.trim();
  } else if (form.id === 'cpf' && el.name === 'reason') { $('#cp-count').textContent = `${el.value.length} / 500`; }
  else if (form.id === 'tpf' && el.name === 'custom' && el.value) { $$('#tpf input[name=amt]').forEach(r => r.checked = false); }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { const um = $('#umenu'); if (um && !um.hidden) { um.hidden = true; $('.userbtn')?.focus(); } }
});
window.addEventListener('hashchange', render);

/* ================= timers ================= */
setInterval(addTick, 3800);
setInterval(() => {
  const ck = $('#r-clock'); if (ck) ck.textContent = clockStr();
  const now = Date.now(); const msgs = [];
  S.orders.forEach(o => { if (o.next && now >= o.next.at) { setStatus(o, o.next.s); msgs.push(autoMsg(o)); } });
  if (msgs.length) {
    save('orders'); renderHeader();
    msgs.forEach(m => toast(m, parseHash().parts[0] === 'pesanan' ? null : { act:'go-orders', label:'Lihat' }));
    if (parseHash().parts[0] === 'pesanan') render();
  }
}, 1000);
ACTIONS['go-orders'] = () => go('#/pesanan');

/* ================= init ================= */
$('#menubtn').innerHTML = ICON.menu;
$('#logo').innerHTML = LOGO;
$('#ts-icon').outerHTML = ICON.search;
/* ----- penyimpanan artifact: perubahan admin terlihat semua pengunjung ----- */
let DB = null, IS_ADMIN = false, ADMIN_CHECKED = false;
function afterData(){
  const r = route();
  if (r === 'admin') { const sub = parseHash().parts[1]; if (sub === 'p' && AED) return; if (!dlg.open) render(); return; }
  if (!dlg.open && !drawer.open) render();
}
(async function connect(){
  if (!window.claude || typeof window.claude.use !== 'function') { ADMIN_CHECKED = true; if (route() === 'admin') render(); return; }
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (user) { try { IS_ADMIN = !!(await user.canEdit()); } catch (e) {} }
    ADMIN_CHECKED = true;
    if (db) {
      DB = db;
      db.collection('data/admin/products').onSnapshot(snap => {
        OVR = {}; snap.docs.forEach(d => { if (d.exists) OVR[d.id] = d.data() || {}; });
        applyOverrides(); afterData();
      }, () => {});
      db.collection('data/admin/apps').onSnapshot(snap => {
        APPS = {}; snap.docs.forEach(d => { const v = d.exists ? d.data() : null; if (v && typeof v.image === 'string' && v.image.startsWith('data:image/')) APPS[d.id.replace('~', '/')] = v.image; });
        afterData();
      }, () => {});
    }
  } catch (e) { ADMIN_CHECKED = true; }
  renderHeader(); if (route() === 'admin') render();
})();
window.addEventListener('beforeunload', e => { if (AED && AED.dirty && route() === 'admin') { e.preventDefault(); e.returnValue = ''; } });

render();
(function announce(){
  if (store.get('ann-hide', false)) return;
  try { if (sessionStorage.getItem('sp:ann')) return; } catch (e) {}
  setTimeout(() => {
    if (dlg.open) return;
    openModal('Pengumuman', `<p>Semua pembayaran di Sapecc lewat rekber. Admin dan penjual tidak akan pernah meminta kamu transfer ke rekening pribadi atau lewat chat.</p><p class="muted small">Diperbarui 30 September 2026</p><label class="opt"><input type="checkbox" id="ann-hide"> Jangan tampilkan lagi</label>`,
      `<button class="btn btn-primary" data-act="ann-ok">OK, mengerti</button>`);
  }, 700);
})();
})();
</script>
</body>
